services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: gateway-prioritisation-api:latest
    container_name: gateway_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATA_DIR=/app/data
      - ARTIFACTS_DIR=/app/artifacts
      - RANKING_METHOD=risk_v1
      - VISIT_LIMIT=15
      - LOG_LEVEL=INFO
    volumes:
      - ./data:/app/data:ro
      - ./artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
